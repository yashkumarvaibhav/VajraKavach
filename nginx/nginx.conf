# Rate limiting zones (applied per client IP)
limit_req_zone $binary_remote_addr zone=api_global:2m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_auth:2m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:2m;

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name 192.168.3.44 _;
    # Return 444 (close connection) on HTTP — prevents credential leakage during redirect
    return 444;
}

server {
    listen 443 ssl http2;
    server_name 192.168.3.44 _;

    # LAN-only access restriction (IIIT Delhi subnets)
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    deny all;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:!CBC:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    # Disable HTTP compression to prevent BREACH attack (CVE-2013-3587)
    gzip off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Global body size default (overridden per-location where needed)
    client_max_body_size 1M;

    # Per-IP connection limit (max 15 concurrent connections per IP)
    limit_conn conn_limit 15;

    # Auth endpoints — strict rate limit (5 req/min per IP)
    location ~ ^/api/auth/(login|register|forgot-password|setup-verify|verify-totp|change-password|delete-account) {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://backend;
        proxy_hide_header X-Request-ID;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1M;
    }

    # WebSocket endpoint — no rate limit, persistent connection
    location = /api/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API -> FastAPI backend (general rate limit)
    location /api/ {
        limit_req zone=api_global burst=10 nodelay;
        proxy_pass http://backend;
        proxy_hide_header X-Request-ID;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    # Block API docs and OpenAPI schema in production
    location = /openapi.json { return 404; }
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }

    # Block sensitive paths that scanners probe (return 404 instead of SPA fallback)
    location ~ /\. { return 404; }
    location ~* ^/(\.env|\.git|\.svn|\.htaccess|wp-admin|wp-login|phpinfo|server-status|server-info|debug|actuator|console) {
        return 404;
    }

    # Frontend — serve static production build
    root /home/iiitd/Desktop/vajrakavach-v01/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (re-add security headers — nginx add_header does not inherit into child blocks)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }
}
