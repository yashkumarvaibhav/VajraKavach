# VajraKavach — nginx edge for vajrakavach.yashkumarvaibhav.me
#
# Derived from nginx/nginx.conf (the LAN/VM deployment). Differences, and why:
#   * Listens on 127.0.0.1:8051 over plain HTTP. TLS is terminated at the
#     Cloudflare edge and the hop to this box runs inside the cloudflared
#     tunnel, so there is no unencrypted network segment. The self-signed
#     443 listener would only make cloudflared distrust its own origin.
#   * No `allow 192.168/16 … deny all`. Every request now arrives from
#     cloudflared on loopback, so the LAN ACL would either allow the whole
#     internet or nobody.
#   * real_ip_header CF-Connecting-IP — without it every visitor shares the
#     127.0.0.1 bucket and one person browsing would rate-limit everyone.
# Security headers, rate limits, and blocked paths are unchanged from the
# original config.

limit_req_zone $binary_remote_addr zone=api_global:2m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_auth:2m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:2m;

upstream backend {
    server 127.0.0.1:8050;
}

server {
    listen 127.0.0.1:8051;
    server_name vajrakavach.yashkumarvaibhav.me;

    # Trust the tunnel's loopback hop only; take the client IP from Cloudflare.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Disable HTTP compression to prevent BREACH attack (CVE-2013-3587)
    gzip off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Global body size default (overridden per-location where needed)
    client_max_body_size 1M;

    # Per-IP connection limit (max 15 concurrent connections per IP)
    limit_conn conn_limit 15;

    # Auth endpoints — strict rate limit (5 req/min per IP)
    location ~ ^/api/auth/(login|register|forgot-password|setup-verify|verify-totp|change-password|delete-account) {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://backend;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1M;
    }

    # WebSocket endpoint — no rate limit, persistent connection
    location = /api/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API -> FastAPI backend (general rate limit)
    location /api/ {
        limit_req zone=api_global burst=10 nodelay;
        proxy_pass http://backend;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 5M;
    }

    # Block API docs and OpenAPI schema in production
    location = /openapi.json { return 404; }
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }

    # Block sensitive paths that scanners probe (return 404 instead of SPA fallback)
    location ~ /\. { return 404; }
    location ~* ^/(\.env|\.git|\.svn|\.htaccess|wp-admin|wp-login|phpinfo|server-status|server-info|debug|actuator|console) {
        return 404;
    }

    # Frontend — serve static production build (mounted from frontend/dist)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (re-add security headers — nginx add_header does not inherit into child blocks)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }
}
